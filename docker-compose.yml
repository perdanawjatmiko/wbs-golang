name: wbs-local
x-backend: &backend
  image: wbs-backend:local
  build:
    context: ./backend
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 30s
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
  env_file:
    - path: ${WBS_ENV_FILE:-.env.docker}
      required: true
  environment: &backend-env
    APP_ENV: local
    HTTP_HOST: 0.0.0.0
    HTTP_PORT: "8080"
    UPLOAD_DIR: /var/private/attachments
    SMTP_ENABLED: "false"
    TELEGRAM_ENABLED: "false"
  extra_hosts:
    - host.docker.internal:host-gateway
  networks: [app]

services:
  backend:
    <<: *backend
    command: [/app/api]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - attachments:/var/private/attachments
    healthcheck:
      test: [CMD, /app/check, live]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
  worker:
    <<: *backend
    command: [/app/worker]
    depends_on:
      backend:
        condition: service_healthy
    # A worker has no HTTP server or attachment requirement.
    healthcheck:
      disable: true
  frontend:
    image: wbs-frontend:local
    build:
      context: ./frontend
    init: true
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_BASE_URL: http://backend:8080
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:3000}"
      NEXT_PUBLIC_APP_NAME: WBS
      UPLOAD_MAX_REQUEST_BYTES: "${UPLOAD_MAX_REQUEST_BYTES:-6291456}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

networks:
  app:
    driver: bridge
volumes:
  attachments:
